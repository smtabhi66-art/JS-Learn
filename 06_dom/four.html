<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code</title>
</head>
<body style = "background-color: #212121;color: #fff;">
    <ul class ="language">
        <li>Javascript</li>
    </ul>
</body>

<script>

/*
in first function below its simple brute force type function 
in which first we make a list in which we add the element to add
 we follow simple three step work 
1->Create node  : for this we in this function we use createElement 
2->Fill node    : for this we do like innerHTML for below function
3->Attach node  : for this we used appendChild(li)

so basically what innerhtml is doing like it creates a new child node and delete previous so 
it first iterate through all and add to new child node aling with the new list that needed to be added

also innerhtml is like it check if the given in correct html format and all so there fore it takes more time
due to this it didnot directly add to the end  
*/ 

    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("typescript")

/*in below method it is like we have
a seperate node which is correct html form and we do not check it like above
snd in this we have text node so we directly append it to the child node 
no need to create new node

1-> create list same as before
2-> createTextNode its different from befoe
3->append is same way

as it is not doing repeated traversal of child node so it directly add it to the end 
faster and also less memory used

*/ 

    function addOptimisedLanguage(language){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(language))
        document.querySelector('.language').appendChild(li)
    }
    addOptimisedLanguage('golang')

// EDIT 

const secondLang = document.querySelector("li:nth-child(2)")
// secondLang.innerHTML = "Mojo"

const newli = document.createElement('li')
newli.textContent = "Mojo"
secondLang.replaceWith(newli)

// edit

const firstLang = document.querySelector("li:first-child")
firstLang.outerHTML = '<li>Typescript</li>'

const lastLang = document.querySelector("li:last-child")
lastLang.remove()

</script>

</html>
